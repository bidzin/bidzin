
name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar estatísticas
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/stats.svg
          users: bidzin
